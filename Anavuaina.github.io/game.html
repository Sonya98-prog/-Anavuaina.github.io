<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#ffb7c5">
    <title>🎭 МАГИЯ ДНЯ | ИГРА</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/rooms.css">
    <link rel="stylesheet" href="css/modal.css">
</head>
<body>
    <div class="container">
        <div class="game-card">
            <a href="index.html" class="back-btn">← Сменить настроение</a>
            
            <div class="room-decor" id="roomDecor"></div>

            <div class="game-header">
                <h1 id="gameTitle">✨ МАГИЯ ДНЯ ✨</h1>
            </div>
            
            <button id="magicBtn" class="magic-btn">🎲 УЗНАТЬ ДЕНЬ 🎲</button>
            
            <div class="oracle-box">
                <div class="item">
                    <div class="label" id="nicknameLabel">🐽 ПРОЗВИЩЕ</div>
                    <div class="value" id="nickname">—</div>
                </div>
                <div class="item">
                    <div class="label" id="fortuneLabel">🔮 ПРЕДСКАЗАНИЕ</div>
                    <div class="value" id="fortune">—</div>
                </div>
                <div class="item">
                    <div class="label" id="quoteLabel">📜 ЦИТАТА</div>
                    <div class="value" id="quote">—</div>
                </div>
                <div class="item">
                    <div class="label" id="emojiLabel">🎨 НАСТРОЕНИЕ ДНЯ</div>
                    <div class="emoji-illustration" id="emojiIllustration">✨</div>
                    <div class="value" id="emojiCaption"></div>
                </div>
            </div>
            
            <footer>каждый день новое предсказание ✨ | кликай по предметам в комнате</footer>
        </div>
    </div>

    <!-- Модальное окно -->
    <div id="modal" class="modal" onclick="window.modalAPI?.close()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-emoji" id="modalEmoji">🧸</div>
            <div class="modal-text" id="modalText">...</div>
            <button class="modal-close" onclick="window.modalAPI?.close()">Закрыть</button>
        </div>
    </div>

    <div id="ghost" style="display: none;">
        <div class="ghost" id="ghostEmoji">👻</div>
        <div class="ghost-speech" id="ghostSpeech">иди спааать...</div>
    </div>

    <!-- Подключаем скрипты -->
    <script src="data/pupsya-data.js"></script>
    <script src="data/suchka-data.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/quiet-hour.js"></script>
    <script src="js/room.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
