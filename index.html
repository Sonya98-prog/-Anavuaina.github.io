<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#ffb7c5">
    <title>🎭 МАГИЯ ДНЯ | ТИХИЙ ЧАС</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Quicksand', system-ui, sans-serif;
            transition: background 0.5s ease, color 0.3s ease;
            padding: 16px;
            position: relative;
        }

        /* Обычные режимы */
        body.pupsya {
            background: linear-gradient(145deg, #ffe6f0 0%, #ffd9e8 100%);
        }

        body.suchka {
            background: radial-gradient(circle at 10% 20%, #0a0a0f, #030305);
        }

        /* ТИХИЙ ЧАС — общая тёмная тема */
        body.quiet-hour {
            background: radial-gradient(circle at 30% 10%, #0a1428, #02040c) !important;
            backdrop-filter: blur(2px);
        }

        body.quiet-hour .game-card {
            background: rgba(10, 15, 30, 0.85) !important;
            border: 1px solid #6b5b7e !important;
            box-shadow: 0 0 20px rgba(100, 80, 120, 0.3) !important;
        }

        body.quiet-hour .magic-btn {
            background: #4a3a5a !important;
            box-shadow: 0 4px 0 #2a1e36 !important;
            color: #e0c8ff !important;
        }

        body.quiet-hour .back-btn {
            background: #4a3a5a !important;
            color: #e0c8ff !important;
        }

        body.quiet-hour .oracle-box {
            background: #0a0a18cc !important;
        }

        body.quiet-hour .value {
            color: #ddd6f0 !important;
        }

        body.quiet-hour .label {
            color: #aa99cc !important;
        }

        body.quiet-hour .emoji-illustration {
            background: #1e1a30 !important;
        }

        /* Призрак */
        .ghost {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 48px;
            cursor: pointer;
            opacity: 0.6;
            transition: 0.2s;
            filter: drop-shadow(0 0 5px #a0a0ff);
            z-index: 1000;
            animation: floatGhost 3s ease-in-out infinite;
        }

        .ghost:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        @keyframes floatGhost {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .ghost-speech {
            position: fixed;
            bottom: 80px;
            right: 70px;
            background: #1e1a30cc;
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            color: #ccb6ff;
            border: 1px solid #8870b0;
            pointer-events: none;
            z-index: 1000;
            white-space: nowrap;
            font-family: monospace;
        }

        @media (max-width: 550px) {
            .ghost { font-size: 40px; bottom: 15px; right: 15px; }
            .ghost-speech { font-size: 10px; right: 55px; bottom: 65px; white-space: nowrap; }
        }

        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }

        .choice-screen {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 2rem 1.5rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        body.quiet-hour .choice-screen {
            background: rgba(20, 18, 40, 0.9);
            color: #ddd;
        }

        .choice-screen h2 {
            font-size: clamp(1.5rem, 6vw, 2rem);
            margin-bottom: 1.5rem;
            color: #4a2a36;
        }

        body.quiet-hour .choice-screen h2 {
            color: #ccb6ff;
        }

        .choice-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-direction: column;
        }

        .mood-btn {
            padding: 16px 20px;
            font-size: clamp(1.2rem, 5vw, 1.4rem);
            font-weight: bold;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: transform 0.05s linear;
            font-family: inherit;
            width: 100%;
        }

        .pupsya-btn {
            background: #ffb7c5;
            color: #6b3a4a;
            box-shadow: 0 4px 0 #c27892;
        }

        .suchka-btn {
            background: #ff2e5e;
            color: white;
            box-shadow: 0 4px 0 #8f1a3a;
        }

        body.quiet-hour .pupsya-btn {
            background: #5a4a7a;
            color: #e0d0ff;
            box-shadow: 0 4px 0 #3a2a50;
        }

        body.quiet-hour .suchka-btn {
            background: #3a2a4a;
            color: #e0b0ff;
            box-shadow: 0 4px 0 #2a1a36;
        }

        .mood-btn:active {
            transform: translateY(2px);
        }

        .game-screen {
            display: none;
        }

        .game-card {
            background: rgba(255, 245, 250, 0.96);
            border-radius: 40px;
            padding: 1.25rem;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
        }

        .game-header h1 {
            font-size: clamp(1.3rem, 5vw, 1.8rem);
            font-weight: 700;
            text-align: center;
        }

        body.pupsya .game-header h1 {
            color: #c55a7f;
        }

        body.suchka .game-header h1 {
            color: #ff4876;
            text-shadow: 2px 2px 0 #5a1e32;
        }

        .back-btn {
            background: #ffb7c5;
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            cursor: pointer;
            margin-bottom: 16px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a2a36;
            display: inline-block;
        }

        .back-btn:active {
            transform: scale(0.97);
        }

        .magic-btn {
            width: 100%;
            padding: 16px;
            font-size: clamp(1.2rem, 5vw, 1.4rem);
            font-weight: bold;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            margin: 16px 0;
            transition: transform 0.05s linear;
        }

        .magic-btn:active {
            transform: translateY(2px);
        }

        .oracle-box {
            border-radius: 28px;
            padding: 0.75rem;
            margin: 12px 0;
        }

        body.pupsya .oracle-box {
            background: #fff0f5;
        }

        body.suchka .oracle-box {
            background: #0e0b12;
        }

        .item {
            margin-bottom: 18px;
            border-left: 4px solid;
            padding-left: 14px;
        }

        body.pupsya .item {
            border-left-color: #f9acc9;
        }

        body.suchka .item {
            border-left-color: #ff4876;
        }

        .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .value {
            font-size: clamp(0.9rem, 4vw, 1rem);
            margin-top: 6px;
            line-height: 1.45;
        }

        .emoji-illustration {
            font-size: clamp(2.5rem, 12vw, 3.5rem);
            text-align: center;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 50px;
            margin: 10px 0;
            letter-spacing: 8px;
        }

        body.pupsya .emoji-illustration {
            background: #ffe2ed;
        }

        body.suchka .emoji-illustration {
            background: #00000040;
        }

        footer {
            font-size: 0.6rem;
            text-align: center;
            margin-top: 16px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
<div class="container">
    <div id="choiceScreen" class="choice-screen">
        <h2>🌸 Сегодня ты... 🌸</h2>
        <div class="choice-buttons">
            <button class="mood-btn pupsya-btn" onclick="selectMood('pupsya')">🐣 ПУПСЯ 🐣</button>
            <button class="mood-btn suchka-btn" onclick="selectMood('suchka')">🔥 ДЕРЗКАЯ СУЧКА 🔥</button>
        </div>
    </div>

    <div id="gameScreen" class="game-screen">
        <div class="game-card">
            <button class="back-btn" onclick="backToChoice()">← Сменить настроение</button>
            <div class="game-header">
                <h1 id="gameTitle">✨ МАГИЯ ДНЯ ✨</h1>
            </div>
            <button id="magicBtn" class="magic-btn">🎲 УЗНАТЬ ДЕНЬ 🎲</button>
            <div class="oracle-box">
                <div class="item">
                    <div class="label" id="nicknameLabel">🐽 ПРОЗВИЩЕ</div>
                    <div class="value" id="nickname">—</div>
                </div>
                <div class="item">
                    <div class="label" id="fortuneLabel">🔮 ПРЕДСКАЗАНИЕ</div>
                    <div class="value" id="fortune">—</div>
                </div>
                <div class="item">
                    <div class="label" id="quoteLabel">📜 ЦИТАТА</div>
                    <div class="value" id="quote">—</div>
                </div>
                <div class="item">
                    <div class="label" id="emojiLabel">🎨 НАСТРОЕНИЕ ДНЯ</div>
                    <div class="emoji-illustration" id="emojiIllustration">✨</div>
                    <div class="value" id="emojiCaption"></div>
                </div>
            </div>
            <footer>каждый день новое предсказание ✨</footer>
        </div>
    </div>
</div>

<!-- Призрак (появляется только в тихий час) -->
<div id="ghost" style="display: none;">
    <div class="ghost" id="ghostEmoji">👻</div>
    <div class="ghost-speech" id="ghostSpeech">иди спааать...</div>
</div>

<script>
    // ---------- ОПРЕДЕЛЯЕМ ТИХИЙ ЧАС ----------
    function isQuietHour() {
        const now = new Date();
        const hours = now.getHours();
       return hours >= 0 && hours < 6;
    }

    // Включаем/выключаем режим тихого часа
    let quietMode = isQuietHour();

    function applyQuietMode() {
        const body = document.body;
        const ghostDiv = document.getElementById('ghost');
        
        if (quietMode) {
            body.classList.add('quiet-hour');
            if (ghostDiv) ghostDiv.style.display = 'block';
        } else {
            body.classList.remove('quiet-hour');
            if (ghostDiv) ghostDiv.style.display = 'none';
        }
    }

    // ---------- СМЯГЧЁННЫЕ ВЕРСИИ ДЛЯ ТИХОГО ЧАСА ----------
    function softenText(text, isPupsyaMode) {
        if (!quietMode) return text;
        
        // Замена матов на милоту
        const replacements = {
            'нахуй': 'спатки',
            'блядь': 'баиньки',
            'сука': 'кисонька',
            'пиздец': 'мимими',
            'говно': 'печеньки',
            'мразь': 'заинька',
            'ёбаный': 'сонный',
            'ебучий': 'дремучий',
            'хуёвая': 'сонная',
            'депрессивная': 'дремучая',
            'террористка': 'сонька'
        };
        
        let softened = text;
        for (let [bad, good] of Object.entries(replacements)) {
            softened = softened.replaceAll(bad, good);
            softened = softened.replaceAll(bad.toUpperCase(), good.toUpperCase());
        }
        
        // Добавляем ночные фразы
        if (isPupsyaMode) {
            softened += ' 🌙✨ Пора укутываться в одеялко и смотреть сны.';
        } else {
            softened += ' 😴💤 Даже самые дерзкие сучки иногда спят. Укутайся и отдохни.';
        }
        
        return softened;
    }

    // ---------- ОСТАЛЬНЫЕ ДАННЫЕ (сокращённо, но рабочие) ----------
    const pupsyaNicknames = [
        "Сладкая булочка", "Лапка счастья", "Мятный пряник", "Облачко в мармеладе", "Пушистый лисёнок",
        "Клубничная фея", "Сахарная панда", "Капучино с корицей", "Солнечный зайчик"
    ];
    const pupsyaFortunes = [
        "Сегодня вселенная обнимет тебя тепло. Съешь что-то вкусное, ты заслужила ❤️",
        "День будет полон маленьких радостей. Кофе, сообщение от подруги или красивый закат ✨",
        "Кто-то сегодня подумает о тебе с теплом. Позволь себе отдохнуть 💖"
    ];
    const pupsyaQuotes = [
        "«Ты — волшебство, которого не хватало миру» 💫",
        "«Твоя доброта — суперсила» 🦋",
        "«Ты достаточно хороша прямо сейчас» 💖"
    ];
    const pupsyaEmojis = [
        { emoji: "🌸🐣💕✨🫶", caption: "День мягкости" },
        { emoji: "🍰☕🎀💖😊", caption: "Вкусный день" }
    ];

    const suchkaNicknames = [
        "Сладкая мразь", "Королева матов", "Ебучий бриллиант", "Кусок дерьма с золотым сердцем",
        "Психопатка с душой панды", "Моя гнилая радость"
    ];
    const suchkaFortunes = [
        "Сегодня пошлёшь нахуй троих. Горжусь, блядь.",
        "Вселенная плюнет в душу, но потом пришлёт мем с котом.",
        "Твой бывший подавится пиццей. Пусть давится, сука."
    ];
    const suchkaQuotes = [
        "«Моё спокойствие — маска. Под ней матерюсь»",
        "«Живу по принципу: либо смеёмся, либо посылаем нахуй»",
        "«Она не токсичная, у неё юмор такой»"
    ];
    const suchkaEmojis = [
        { emoji: "💀🔥🤡💢👹", caption: "День агрессии" },
        { emoji: "🍺🚬😈💩🔞", caption: "Алкогольный вайб" }
    ];

    function randomItem(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    let currentMood = null;

    function selectMood(mood) {
        currentMood = mood;
        document.body.className = mood + (quietMode ? ' quiet-hour' : '');
        document.getElementById("choiceScreen").style.display = "none";
        document.getElementById("gameScreen").style.display = "block";
        
        if (mood === "pupsya") {
            document.getElementById("gameTitle").innerHTML = "🐣 ПУПСЯ ДНЯ 🐣";
            document.getElementById("nicknameLabel").innerHTML = "🐽 ПРОЗВИЩЕ";
            document.getElementById("fortuneLabel").innerHTML = "🔮 ПРЕДСКАЗАНИЕ";
            document.getElementById("quoteLabel").innerHTML = "📜 ЦИТАТА";
        } else {
            document.getElementById("gameTitle").innerHTML = "🔥 ДЕРЗКАЯ СУЧКА 🔥";
            document.getElementById("nicknameLabel").innerHTML = "🐽 КЛИЧКА";
            document.getElementById("fortuneLabel").innerHTML = "🔮 ПРЕДСКАЗАНИЕ";
            document.getElementById("quoteLabel").innerHTML = "📜 ЦИТАТА";
        }
        
        generateMagic();
    }

    function backToChoice() {
        currentMood = null;
        document.getElementById("choiceScreen").style.display = "block";
        document.getElementById("gameScreen").style.display = "none";
        document.body.className = quietMode ? 'quiet-hour' : '';
    }

    function generateMagic() {
        if (!currentMood) return;
        
        let nickname, fortune, quote, emojiData;
        
        if (currentMood === "pupsya") {
            nickname = randomItem(pupsyaNicknames);
            fortune = randomItem(pupsyaFortunes);
            quote = randomItem(pupsyaQuotes);
            emojiData = randomItem(pupsyaEmojis);
            
            if (quietMode) {
                nickname = softenText(nickname, true);
                fortune = softenText(fortune, true);
                quote = softenText(quote, true);
                emojiData.emoji = "🌙✨💤😴🛌";
                emojiData.caption = "Сонный режим... баиньки";
            }
        } else {
            nickname = randomItem(suchkaNicknames);
            fortune = randomItem(suchkaFortunes);
            quote = randomItem(suchkaQuotes);
            emojiData = randomItem(suchkaEmojis);
            
            if (quietMode) {
                nickname = softenText(nickname, false);
                fortune = softenText(fortune, false);
                quote = softenText(quote, false);
                emojiData.emoji = "🛌😴💤🌙👻";
                emojiData.caption = "Даже сучки спят...";
            }
        }
        
        document.getElementById("nickname").innerHTML = nickname;
        document.getElementById("fortune").innerHTML = fortune;
        document.getElementById("quote").innerHTML = quote;
        document.getElementById("emojiIllustration").innerHTML = emojiData.emoji;
        document.getElementById("emojiCaption").innerHTML = emojiData.caption;
        
        if (navigator.vibrate) navigator.vibrate(50);
    }
    
    document.getElementById("magicBtn").addEventListener("click", generateMagic);
    
    // Запускаем тихий час
    applyQuietMode();
    
    // Если тихий час — добавляем шепот призрака при нажатии
    if (quietMode) {
        const magicBtn = document.getElementById("magicBtn");
        const ghostSpeech = document.getElementById("ghostSpeech");
        magicBtn.addEventListener("click", () => {
            if (ghostSpeech) {
                ghostSpeech.style.opacity = "1";
                setTimeout(() => {
                    ghostSpeech.style.opacity = "0.6";
                }, 800);
            }
        });
    }
    
    // Если тихий час, добавляем начальный текст
    if (quietMode) {
        document.getElementById("nickname").innerHTML = "🤫 Тсс... сейчас тихий час";
        document.getElementById("fortune").innerHTML = "Призрак советует выпить тёплого молока и лечь спать 🌙";
        document.getElementById("quote").innerHTML = "«Сладких снов, маленькая булочка»";
        document.getElementById("emojiIllustration").innerHTML = "👻🌙✨🛌💤";
        document.getElementById("emojiCaption").innerHTML = "Ночной режим... баю-бай";
    }
</script>
</body>
</html>
