<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#ffb7c5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>🎭 МАГИЯ ДНЯ | ПУПСЯ или СУЧКА</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, 'Comic Neue', 'Helvetica Neue', sans-serif;
            transition: background 0.3s ease;
            padding: 16px;
        }

        body.pupsya {
            background: linear-gradient(145deg, #ffe6f0 0%, #ffd9e8 100%);
        }

        body.suchka {
            background: radial-gradient(circle at 10% 20%, #0a0a0f, #030305);
        }

        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }

        /* Экран выбора настроения */
        .choice-screen {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 2rem 1.5rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        body.suchka .choice-screen {
            background: rgba(255, 255, 255, 0.94);
        }

        .choice-screen h2 {
            font-size: clamp(1.5rem, 6vw, 2rem);
            margin-bottom: 1.5rem;
            color: #4a2a36;
            font-weight: 600;
        }

        .choice-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-direction: column;
        }

        .mood-btn {
            padding: 16px 20px;
            font-size: clamp(1.2rem, 5vw, 1.4rem);
            font-weight: bold;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: transform 0.05s linear;
            font-family: inherit;
            width: 100%;
        }

        .pupsya-btn {
            background: #ffb7c5;
            color: #6b3a4a;
            box-shadow: 0 4px 0 #c27892;
        }

        .suchka-btn {
            background: #ff2e5e;
            color: white;
            box-shadow: 0 4px 0 #8f1a3a;
        }

        .mood-btn:active {
            transform: translateY(2px);
        }

        /* Основной экран игры */
        .game-screen {
            display: none;
        }

        .game-card {
            background: rgba(255, 245, 250, 0.96);
            border-radius: 40px;
            padding: 1.25rem;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.2);
        }

        body.suchka .game-card {
            background: #1c1825;
            border: 1px solid #ff2e5e;
        }

        .game-header {
            text-align: center;
            margin-bottom: 1rem;
        }

        .game-header h1 {
            font-size: clamp(1.3rem, 5vw, 1.8rem);
            font-weight: 700;
        }

        body.pupsya .game-header h1 {
            color: #c55a7f;
        }

        body.suchka .game-header h1 {
            color: #ff4876;
            text-shadow: 2px 2px 0 #5a1e32;
        }

        .back-btn {
            background: #ffb7c5;
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            cursor: pointer;
            margin-bottom: 16px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a2a36;
            transition: transform 0.05s linear;
            width: auto;
            display: inline-block;
        }

        .back-btn:active {
            transform: scale(0.97);
        }

        body.suchka .back-btn {
            background: #ff2e5e;
            color: white;
        }

        .magic-btn {
            width: 100%;
            padding: 16px;
            font-size: clamp(1.2rem, 5vw, 1.4rem);
            font-weight: bold;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            margin: 16px 0;
            transition: transform 0.05s linear;
            font-family: inherit;
        }

        body.pupsya .magic-btn {
            background: #ffb7c5;
            color: #4a2a36;
            box-shadow: 0 4px 0 #c27892;
        }

        body.suchka .magic-btn {
            background: #ff2e5e;
            color: white;
            box-shadow: 0 4px 0 #8f1a3a;
        }

        .magic-btn:active {
            transform: translateY(2px);
        }

        .oracle-box {
            border-radius: 28px;
            padding: 0.75rem;
            margin: 12px 0;
        }

        body.pupsya .oracle-box {
            background: #fff0f5;
        }

        body.suchka .oracle-box {
            background: #0e0b12;
        }

        .item {
            margin-bottom: 18px;
            border-left: 4px solid;
            padding-left: 14px;
        }

        body.pupsya .item {
            border-left-color: #f9acc9;
        }

        body.suchka .item {
            border-left-color: #ff4876;
        }

        .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        body.pupsya .label {
            color: #d4769a;
        }

        body.suchka .label {
            color: #ff90b0;
        }

        .value {
            font-size: clamp(0.9rem, 4vw, 1rem);
            margin-top: 6px;
            line-height: 1.45;
        }

        body.pupsya .value {
            color: #2d1e24;
        }

        body.suchka .value {
            color: #f0e6d0;
        }

        .emoji-illustration {
            font-size: clamp(2.5rem, 12vw, 3.5rem);
            text-align: center;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 50px;
            margin: 10px 0;
            letter-spacing: 8px;
            word-break: keep-all;
        }

        body.pupsya .emoji-illustration {
            background: #ffe2ed;
        }

        body.suchka .emoji-illustration {
            background: #00000040;
        }

        footer {
            font-size: 0.6rem;
            text-align: center;
            margin-top: 16px;
            opacity: 0.7;
        }

        body.pupsya footer {
            color: #b86f8a;
        }

        body.suchka footer {
            color: #6e5b70;
        }

        /* Дополнительные мобильные улучшения */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .game-card {
                padding: 1rem;
            }
            .item {
                margin-bottom: 14px;
                padding-left: 12px;
            }
            .emoji-illustration {
                padding: 10px;
                letter-spacing: 5px;
            }
            .back-btn {
                padding: 8px 16px;
                font-size: 0.8rem;
            }
        }

        /* Для очень маленьких экранов */
        @media (max-width: 380px) {
            .choice-screen {
                padding: 1.5rem 1rem;
            }
            .value {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div id="choiceScreen" class="choice-screen">
        <h2>🌸 Сегодня ты... 🌸</h2>
        <div class="choice-buttons">
            <button class="mood-btn pupsya-btn" onclick="selectMood('pupsya')">🐣 ПУПСЯ 🐣</button>

    <div id="gameScreen" class="game-screen">

            </div>
            <button id="magicBtn" class="magic-btn">🎲 УЗНАТЬ ДЕНЬ 🎲</button>
            <div class="oracle-box">
                <div class="item">
                    <div class="label" id="nicknameLabel">🐽 ПРОЗВИЩЕ</div>
                    <div class="value" id="nickname">—</div>
                </div>
                <div class="item">
                    <div class="label" id="fortuneLabel">🔮 ПРЕДСКАЗАНИЕ</div>
                    <div class="value" id="fortune">—</div>
                </div>
                <div class="item">
                    <div class="label" id="quoteLabel">📜 ЦИТАТА</div>
                    <div class="value" id="quote">—</div>
                </div>
                <div class="item">
                    <div class="label" id="emojiLabel">🎨 НАСТРОЕНИЕ ДНЯ</div>
                    <div class="emoji-illustration" id="emojiIllustration">✨</div>
                    <div class="value" id="emojiCaption"></div>
                </div>
            </div>
            <footer>каждый день новое предсказание ✨ нажимай сколько хочешь</footer>

</div>

        { emoji: "🤬💀🖕😤🍻", caption: "День посылания всех нахуй" },
        { emoji: "🐍🔪💣🩸🥀", caption: "Токсичная королева вышла на охоту" },
        { emoji: "🖤🧨😵‍💫🍷🚬", caption: "Меланхолия с перчинкой" },
        { emoji: "🤡🎪💩🔥🍺", caption: "Цирк уехал, а ты осталась" },
        { emoji: "👻🪦💀🕷️🦇", caption: "Готический понедельник" },
        { emoji: "😈🤘🖤🥃🔪", caption: "Рок-звезда депрессивного блюза" },
        { emoji: "💣🔥👹🤬🖕", caption: "День взрыва мозга и терпения" },
        { emoji: "🧠💀🍺😵‍💫🫠", caption: "Мозг уехал, привет, похмелье" }
    ];

    function randomItem(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    let currentMood = null;

    function selectMood(mood) {
        currentMood = mood;
        document.body.className = mood;
        document.getElementById("choiceScreen").style.display = "none";
        document.getElementById("gameScreen").style.display = "block";
        
        if (mood === "pupsya") {
            document.getElementById("gameTitle").innerHTML = "🐣 ПУПСЯ ДНЯ 🐣";
            document.getElementById("nicknameLabel").innerHTML = "🐽 ТВОЁ ПРОЗВИЩЕ";
            document.getElementById("fortuneLabel").innerHTML = "🔮 ПРЕДСКАЗАНИЕ ДЛЯ ТЕБЯ";
            document.getElementById("quoteLabel").innerHTML = "📜 ТЕПЛАЯ ЦИТАТА";
            document.getElementById("emojiLabel").innerHTML = "🎨 НАСТРОЕНИЕ ДНЯ";
        } else {
            document.getElementById("gameTitle").innerHTML = "🔥 ДЕРЗКАЯ СУЧКА 🔥";
            document.getElementById("nicknameLabel").innerHTML = "🐽 КЛИЧКА НА СЕГОДНЯ";
            document.getElementById("fortuneLabel").innerHTML = "🔮 ПРЕДСКАЗАНИЕ (маты)";
            document.getElementById("quoteLabel").innerHTML = "📜 ЦИТАТА (чёрный юмор)";
            document.getElementById("emojiLabel").innerHTML = "🎨 НАСТРОЕНИЕ ДНЯ";
        }
        
        generateMagic();
    }

    function backToChoice() {
        currentMood = null;
        document.getElementById("choiceScreen").style.display = "block";
        document.getElementById("gameScreen").style.display = "none";
        document.body.className = ""; 
    }

    function generateMagic() {
        if (!currentMood) return;
        
        let nickname, fortune, quote, emojiData;
        
        if (currentMood === "pupsya") {
            nickname = randomItem(pupsyaNicknames);
            fortune = randomItem(pupsyaFortunes);
            quote = randomItem(pupsyaQuotes);
            emojiData = randomItem(pupsyaEmojis);
        } else {
            nickname = randomItem(suchkaNicknames);
            fortune = randomItem(suchkaFortunes);
            quote = randomItem(suchkaQuotes);
            emojiData = randomItem(suchkaEmojis);
        }
        
        document.getElementById("nickname").innerHTML = nickname;
        document.getElementById("fortune").innerHTML = fortune;
        document.getElementById("quote").innerHTML = quote;
        document.getElementById("emojiIllustration").innerHTML = emojiData.emoji;
        document.getElementById("emojiCaption").innerHTML = emojiData.caption;
        
        if (navigator.vibrate) navigator.vibrate(50);
    }
    
    document.getElementById("magicBtn").addEventListener("click", generateMagic);
</script>
</body>
</html>
